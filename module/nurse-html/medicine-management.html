<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Medications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/hospital-theme.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/components-js/sidebar.js" defer></script>
    <script src="../../js/components-js/header-loader.js" defer></script>
    <script src="../../js/nurse-js/medicine-management.js" defer></script>
    <script src="../../js/utility-js/theme-loader.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">
    <!-- Header -->
    <div id="header-placeholder"></div>
    <div id="page-container" class="d-flex flex-grow-1">
        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>
        <!-- Main Content -->
        <main class="content p-3 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2><i class="fas fa-pills me-2"></i> Patient Medications</h2>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th><input type="checkbox" id="selectAll"></th>
                                    <th>Batch</th>
                                    <th>Patient</th>
                                    <th>Medicine</th>
                                    <th>Qty</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="medicinesTableBody">
                                <!-- Rows will be injected by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3">
                        <button id="confirmPickupBtn" class="btn btn-success btn-sm">Confirm Pickup</button>
                        <button id="administerBtn" class="btn btn-primary btn-sm" disabled>Administer</button>
                        <button id="returnBtn" class="btn btn-danger btn-sm" disabled>Return</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
