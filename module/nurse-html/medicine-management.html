<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Medications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/hospital-theme.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/components-js/sidebar.js" defer></script>
    <script src="../../js/components-js/header-loader.js" defer></script>
    <script src="../../js/nurse-js/medicine-management.js" defer></script>
    <script src="../../js/utility-js/theme-loader.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">
    <!-- Header -->
    <div id="header-placeholder"></div>
    <div id="page-container" class="d-flex flex-grow-1">
        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>
        <!-- Main Content -->
        <main class="content p-3 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2><i class="fas fa-pills me-2"></i> Patient Medications</h2>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th><input type="checkbox" id="selectAll"></th>
                                    <th>Patient</th>
                                    <th>Doctor</th>
                                    <th>Request Date</th>
                                    <th>Status</th>
                                    <th>Items</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="medicinesTableBody">
                                <!-- Rows will be injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Batch Details Modal -->
    <div class="modal fade" id="batchDetailsModal" tabindex="-1" aria-labelledby="batchDetailsModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="batchDetailsModalLabel">Medicine Batch Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p><strong>Batch ID:</strong> <span id="modalBatchId"></span></p>
                            <p><strong>Patient:</strong> <span id="modalPatientName"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Doctor:</strong> <span id="modalDoctorName"></span></p>
                            <p><strong>Status:</strong> <span id="modalBatchStatus"></span></p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <p><strong>Notes:</strong> <span id="modalBatchNotes"></span></p>
                    </div>

                    <h6>Medicines in this Batch</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered">
                            <thead>
                                <tr>
                                    <th class="text-center">
                                        <input type="checkbox" id="selectAllModalCheckbox">
                                    </th>
                                    <th>Medicine</th>
                                    <th>Available Qty</th>
                                    <th>Qty to Process</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="batchItemsTableBody">
                                <!-- Items will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="modalConfirmPickupBtn" class="btn btn-success" disabled>
                        <i class="fas fa-check me-1"></i> Confirm Pickup
                    </button>
                    <button type="button" id="modalAdministerBtn" class="btn btn-primary" disabled>
                        <i class="fas fa-syringe me-1"></i> Administer
                    </button>
                    <button type="button" id="modalReturnBtn" class="btn btn-danger" disabled>
                        <i class="fas fa-undo me-1"></i> Return
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
