<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Billing System - Billing Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/hospital-theme.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/components-js/sidebar.js" defer></script>
    <script src="../../js/components-js/header-loader.js" defer></script>
    <script src="../../js/placeholder-js/billing.js" defer></script>
    <script src="../../js/utility-js/theme-loader.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">
    <!-- Header -->
    <div id="header-placeholder"></div>
    <!-- side bar -->
    <div id="page-container" class="d-flex flex-grow-1">
        <div id="sidebar-placeholder"></div>
        <!-- Main Content -->
        <main class="content p-3 flex-grow-1">
            <div class="container-fluid">
                <div class="row g-3 align-items-end mb-3">
                    <div class="col-12 col-md-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" id="startDate" class="form-control" />
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label">End Date</label>
                        <input type="date" id="endDate" class="form-control" />
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label">Status</label>
                        <select id="statusFilter" class="form-select">
                            <option value="ALL" selected>All</option>
                            <option value="draft">Draft</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="paid">Paid</option>
                            <option value="partial">Partial</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3 d-flex gap-2">
                        <button id="applyFiltersBtn" class="btn btn-primary w-100">Apply</button>
                        <button id="printBtn" class="btn btn-secondary">Print</button>
                    </div>
                </div>
                <!-- KPI Cards -->
                <div class="row g-3" id="kpiRow">
                    <div class="col-12 col-md-3">
                        <div class="card text-bg-light">
                            <div class="card-body">
                                <div class="small text-muted">Invoices</div>
                                <div id="kpiInvoices" class="fs-4">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="card text-bg-light">
                            <div class="card-body">
                                <div class="small text-muted">Total Billed</div>
                                <div id="kpiBilled" class="fs-4">0.00</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="card text-bg-light">
                            <div class="card-body">
                                <div class="small text-muted">Insurance Covered</div>
                                <div id="kpiCovered" class="fs-4">0.00</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="card text-bg-light">
                            <div class="card-body">
                                <div class="small text-muted">Amount Due</div>
                                <div id="kpiDue" class="fs-4">0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Invoices Table -->
                <div class="card mt-3">
                    <div class="card-header bg-primary text-white">
                        <h6 class="mb-0">Invoices</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Invoice ID</th>
                                        <th>Invoice Date</th>
                                        <th>Patient</th>
                                        <th class="text-end">Total</th>
                                        <th class="text-end">Covered</th>
                                        <th class="text-end">Due</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="invoiceBody">
                                    <tr>
                                        <td colspan="8" class="text-center text-muted">No data.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Print-only area -->
            <div id="printArea" class="d-none"></div>

            <!-- Payment Modal -->
            <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="paymentModalLabel">Make Payment</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="paymentForm">
                                <div class="mb-3">
                                    <label for="invoiceIdDisplay" class="form-label">Invoice ID</label>
                                    <input type="text" class="form-control" id="invoiceIdDisplay" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="patientNameDisplay" class="form-label">Patient</label>
                                    <input type="text" class="form-control" id="patientNameDisplay" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="amountDueDisplay" class="form-label">Amount Due</label>
                                    <input type="text" class="form-control" id="amountDueDisplay" readonly>
                                </div>
                                <div class="mb-3">
                                    <label for="paymentAmount" class="form-label">Payment Amount</label>
                                    <input type="number" class="form-control" id="paymentAmount" min="0.01" step="0.01"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label for="paymentMethod" class="form-label">Payment Method</label>
                                    <select class="form-select" id="paymentMethod" required>
                                        <option value="">Select Payment Method</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="paymentDate" class="form-label">Payment Date</label>
                                    <input type="date" class="form-control" id="paymentDate" required>
                                </div>
                                <div class="mb-3">
                                    <label for="paymentNotes" class="form-label">Notes (Optional)</label>
                                    <textarea class="form-control" id="paymentNotes" rows="2"></textarea>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-primary" id="submitPaymentBtn">Submit Payment</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notification Toast -->
            <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
                <div id="paymentToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto">Payment Status</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body" id="toastMessage">
                        Payment processed successfully!
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
