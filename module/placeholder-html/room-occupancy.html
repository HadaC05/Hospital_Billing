<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Occupancy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/hospital-theme.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../../js/components-js/sidebar.js" defer></script>
  <script src="../../js/components-js/header-loader.js" defer></script>
  <script src="../../js/utility-js/pagination-utility.js" defer></script>
  <script src="../../js/utility-js/theme-loader.js" defer></script>
  <script src="../../js/placeholder-js/room-occupancy.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">
  <div id="header-placeholder"></div>
  <div id="page-container" class="d-flex flex-grow-1">
    <div id="sidebar-placeholder"></div>
    <main class="content p-3 flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-bed me-2"></i>Room Occupancy</h2>
        <div class="text-muted small" id="occ-date"></div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Total Rooms</div>
                <div class="kpi-value" id="kpi-total-rooms">0</div>
              </div>
              <i class="fas fa-door-open kpi-icon text-primary"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Occupied</div>
                <div class="kpi-value" id="kpi-occupied">0</div>
              </div>
              <i class="fas fa-bed-pulse kpi-icon text-danger"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Available</div>
                <div class="kpi-value" id="kpi-available">0</div>
              </div>
              <i class="fas fa-circle-check kpi-icon text-success"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">ER Holds</div>
                <div class="kpi-value" id="kpi-er">0</div>
              </div>
              <i class="fas fa-truck-medical kpi-icon text-info"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="occ-search" class="form-label">Search</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input id="occ-search" type="text" class="form-control"
                  placeholder="Search by room #, type, or patient..." />
              </div>
            </div>
            <div class="col-md-3">
              <label for="occ-type" class="form-label">Room Type</label>
              <select id="occ-type" class="form-select">
                <option value="ALL" selected>All Types</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="occ-status" class="form-label">Status</label>
              <select id="occ-status" class="form-select">
                <option value="ALL" selected>All</option>
                <option value="OCCUPIED">Occupied</option>
                <option value="AVAILABLE">Available</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="occ-sort" class="form-label">Sort</label>
              <select id="occ-sort" class="form-select">
                <option value="ROOM">Room Number</option>
                <option value="TYPE">Room Type</option>
                <option value="STATUS">Status</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Room #</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Patient</th>
                  <th>Admission ID</th>
                  <th>Admitted</th>
                </tr>
              </thead>
              <tbody id="occ-tbody">
                <tr>
                  <td colspan="6" class="text-center text-muted"><i class="fas fa-spinner fa-pulse me-2"></i>Loading...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</body>

</html>
