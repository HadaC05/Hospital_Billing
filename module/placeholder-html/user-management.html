<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Billing System - User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/hospital-theme.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

    <style>
        .user-creation-form {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }

        .form-section {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .form-section-title {
            font-weight: bold;
            color: #0c63e4;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 6px;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .form-label {
            font-size: 0.9rem;
            margin-bottom: 3px;
        }

        .form-control,
        .form-select {
            font-size: 0.9rem;
            padding: 0.375rem 0.75rem;
        }

        .mb-2 {
            margin-bottom: 0.75rem !important;
        }

        .row {
            margin-bottom: 5px;
        }

        .role-specific-section {
            display: none;
        }

        .role-specific-section.active {
            display: block;
        }
    </style>

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Ensure SweetAlert modals sit above Bootstrap modals */
        .swal2-container {
            z-index: 20000 !important;
        }

        .swal2-popup {
            z-index: 20001 !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/components-js/sidebar.js" defer></script>
    <script src="../../js/components-js/header-loader.js" defer></script>
    <script src="../../js/utility-js/pagination-utility.js" defer></script>
    <script src="../../js/placeholder-js/user-management.js" defer></script>
    <script src="../../js/utility-js/theme-loader.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Sidebar -->
    <div id="page-container" class="d-flex flex-grow-1">
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="content p-3 flex-grow-1">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">User Accounts</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                        <i class="fas fa-user-plus me-1"></i> Add User
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination Container -->
                    <div id="pagination-container" class="mt-3"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Create New User Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="user-creation-form">
                        <form id="addUserForm">
                            <!-- Role Selection -->
                            <div class="form-section">
                                <div class="form-section-title">USER ROLE</div>
                                <div class="mb-3">
                                    <label for="roleId" class="form-label">Select Role</label>
                                    <select class="form-select" id="roleId" required>
                                        <option value="">-- Select a role --</option>
                                        <option value="2">Doctor</option>
                                        <option value="4">Nurse</option>
                                        <option value="5">Lab Technician</option>
                                        <option value="6">Pharmacist</option>
                                        <option value="7">Therapist</option>
                                        <option value="8">Cashier</option>
                                        <option value="9">Billing Staff</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Authentication Details -->
                            <div class="form-section">
                                <div class="form-section-title">AUTHENTICATION DETAILS</div>
                                <div class="row mb-2">
                                    <div class="col-md-6">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="username" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="password" required>
                                            <button type="button" class="btn btn-outline-secondary password-toggle"
                                                data-target="password" aria-label="Show password">
                                                <i class="fa-regular fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email (Optional)</label>
                                        <input type="email" class="form-control" id="email">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="mobileNumber" class="form-label">Mobile Number (Optional)</label>
                                        <input type="text" class="form-control" id="mobileNumber"
                                            placeholder="09XXXXXXXXX">
                                    </div>
                                </div>
                            </div>

                            <!-- Dynamic Role-Specific Fields -->
                            <div id="roleSpecificFields"></div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveUserBtn">Create User Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editUserForm">
                        <input type="hidden" id="editUserId">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="editFirstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="editFirstName" required>
                            </div>
                            <div class="col-md-4">
                                <label for="editMiddleName" class="form-label">Middle Name</label>
                                <input type="text" class="form-control" id="editMiddleName">
                            </div>
                            <div class="col-md-4">
                                <label for="editLastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="editLastName" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="editUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="editUsername" required>
                            </div>
                            <div class="col-md-6">
                                <label for="editPassword" class="form-label">Password (leave blank to keep
                                    current)</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="editPassword">
                                    <button type="button" class="btn btn-outline-secondary password-toggle"
                                        data-target="editPassword" aria-label="Show password">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="editEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail" required>
                            </div>
                            <div class="col-md-6">
                                <label for="editMobileNumber" class="form-label">Mobile Number</label>
                                <input type="text" class="form-control" id="editMobileNumber">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editRoleId" class="form-label">Role</label>
                            <select class="form-select" id="editRoleId" required>
                                <option value="">Select a role</option>
                                <!-- Roles will be loaded here -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updateUserBtn">Update User</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
