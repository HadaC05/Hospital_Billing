<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Billing System - User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/hospital-theme.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/user-management.css">
    <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/components-js/sidebar.js" defer></script>
    <script src="../../js/components-js/header-loader.js" defer></script>
    <script src="../../js/utility-js/pagination-utility.js" defer></script>
    <script src="../../js/placeholder-js/user-management.js" defer></script>
    <script src="../../js/utility-js/theme-loader.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Sidebar -->
    <div id="page-container" class="d-flex flex-grow-1">
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="content p-3 flex-grow-1">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">User Accounts</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                        <i class="fas fa-user-plus me-1"></i> Add User
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-list">
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination Container -->
                    <div id="pagination-container" class="mt-3"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Create New User Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="user-creation-form">
                        <form id="addUserForm">
                            <!-- Role Selection -->
                            <div class="form-section">
                                <div class="form-section-title">USER ROLE</div>
                                <div class="mb-3">
                                    <label for="role_id" class="form-label">Select Role</label>
                                    <select class="form-select" name="role_id" id="role_id" required>
                                        <option value="">-- Select a role --</option>
                                        <option value="2">Doctor</option>
                                        <option value="4">Nurse</option>
                                        <option value="5">Lab Technician</option>
                                        <option value="6">Pharmacist</option>
                                        <option value="7">Therapist</option>
                                        <option value="8">Cashier</option>
                                        <option value="9">Billing Staff</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Authentication Details -->
                            <div class="form-section">
                                <div class="form-section-title">AUTHENTICATION DETAILS</div>
                                <div class="row mb-2">
                                    <div class="col-md-6">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" name="username" id="username" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="input-group">
                                            <input name="password" type="password" class="form-control" id="password"
                                                required>
                                            <button type="button" class="btn btn-outline-secondary password-toggle"
                                                data-target="password" aria-label="Show password">
                                                <i class="fa-regular fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email (Optional)</label>
                                        <input type="email" class="form-control" name="email" id="email">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="mobileNumber" class="form-label">Mobile Number (Optional)</label>
                                        <input type="text" class="form-control" name="mobile_number" id="mobile_number">
                                    </div>
                                </div>
                            </div>

                            <!-- Dynamic Role-Specific Fields -->
                            <div id="roleSpecificFields"></div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveUserBtn">Create User Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="editUserForm">
                        <input type="hidden" id="edit_user_id">

                        <div class="form-section">
                            <div class="form-section-title">AUTHENTICATION DETAILS</div>
                            <div class="row mb-2">
                                <div class="col-md-6">
                                    <label for="edit_username" class="form-label">Username</label>
                                    <input type="text" class="form-control" name="edit_username" id="edit_username"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <input name="edit_password" type="password" class="form-control"
                                            id="edit_password" required>
                                        <button type="button" class="btn btn-outline-secondary password-toggle"
                                            data-target="password" aria-label="Show password">
                                            <i class="fa-regular fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-md-6">
                                    <label for="edit_email" class="form-label">Email (Optional)</label>
                                    <input type="email" class="form-control" name="edit_email" id="edit_email">
                                </div>
                                <div class="col-md-6">
                                    <label for="edit_mobile_number" class="form-label">Mobile Number (Optional)</label>
                                    <input type="text" class="form-control" name="edit_mobile_number"
                                        id="edit_mobile_number">
                                </div>
                            </div>
                        </div>

                        <div id="editRoleSpecificFields" class="mt-3">
                            <!-- Dynamic role-specific fields will be inserted here based on the role of the user to be edited-->
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="edit_status" class="form-label">Status</label>
                                <select name="edit_status" id="edit_status" class="form-select" required>
                                    <option value="1">Active</option>
                                    <option value="0">Inactive</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updateUserBtn">Update User</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
