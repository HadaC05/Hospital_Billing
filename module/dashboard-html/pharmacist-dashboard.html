<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharmacist Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/hospital-theme.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="icon" type="image/png" href="../../assets/images/favicon-32.png">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../../js/components-js/sidebar.js" defer></script>
  <script src="../../js/components-js/header-loader.js" defer></script>
  <script src="../../js/utility-js/theme-loader.js" defer></script>
  <script src="../../js/dashboard-js/pharmacist-dashboard.js" defer></script>
</head>

<body class="d-flex flex-column vh-100">
  <div id="header-placeholder"></div>
  <div id="page-container" class="d-flex flex-grow-1">
    <div id="sidebar-placeholder"></div>
    <main class="content p-3 flex-grow-1">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-pills me-2"></i>Pharmacist Dashboard</h2>
        <div class="text-muted small" id="pharm-date"></div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Active Patients</div>
                <div class="kpi-value" id="pharm-kpi-active">0</div>
              </div><i class="fas fa-user-injured kpi-icon text-primary"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Admissions (Today)</div>
                <div class="kpi-value" id="pharm-kpi-admit-today">0</div>
              </div><i class="fas fa-calendar-plus kpi-icon text-success"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Discharges (Today)</div>
                <div class="kpi-value" id="pharm-kpi-disch-today">0</div>
              </div><i class="fas fa-person-walking-arrow-right kpi-icon text-warning"></i>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card kpi-card">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <div class="kpi-title">Admissions (30 days)</div>
                <div class="kpi-value" id="pharm-kpi-admit30">0</div>
              </div><i class="fas fa-calendar-days kpi-icon text-info"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><i class="fas fa-prescription-bottle-alt me-2"></i>Medicine Requests</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Batch ID</th>
                  <th>Patient Name</th>
                  <th>Doctor Name</th>
                  <th>Request Date</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="medicine-requests-list"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Batch Details Modal -->
      <div class="modal fade" id="batchDetailsModal" tabindex="-1" aria-labelledby="batchDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="batchDetailsModalLabel">Batch Details</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <h6 class="mb-3">Request Items for Batch #<span id="batchIdSpan"></span></h6>
              <div id="batchItemsContainer" class="table-responsive">
                <table class="table table-sm table-bordered">
                  <thead>
                    <tr>
                      <th>Medicine Name</th>
                      <th>Quantity</th>
                      <th>Notes</th>
                    </tr>
                  </thead>
                  <tbody id="batchItemsTbody"></tbody>
                </table>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</body>

</html>
