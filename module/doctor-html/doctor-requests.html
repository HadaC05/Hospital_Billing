    <script src="../../js/utility-js/pagination-utility.js" defer></script>

    <div id="header-placeholder"></div>

                <div class="row g-3">
                    <!-- Page Header -->
                    <div class="col-12">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2><i class="fas fa-prescription-bottle-alt me-2"></i>Doctor Requests</h2>
                            <button class="btn btn-primary" id="newRequestBtn">
                                <i class="fas fa-plus me-2"></i>New Request
                            </button>
                        </div>
                    </div>

                    <!-- Requests Table -->
                    <div class="col-12">
                        <div class="card">
                            <div
                                class="card-header text-white bg-primary d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Request History</h5>
                                <button class="btn btn-sm btn-outline-light" id="printBtn" disabled>
                                    <i class="fas fa-print me-1"></i>Print
                                </button>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover table-striped align-middle" id="requestsTable">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>Request Date</th>
                                                <th>Patient Name</th>
                                                <th>Type</th>
                                                <th>Item</th>
                                                <th>Quantity</th>
                                                <th>Status</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="resquest-list">
                                            <tr>
                                                <td colspan="8" class="text-center text-muted">No requests found.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div id="requestsPagination" class="mt-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Print-only area -->
            <div id="printArea" class="d-none"></div>
        </main>
    </div>

    <!-- New Request Modal -->
    <div class="modal fade" id="newRequestModal" tabindex="-1" aria-labelledby="newRequestModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newRequestModalLabel">New Request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newRequestForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="requestPatient" class="form-label">Patient *</label>
                                <select class="form-select" id="requestPatient" required>
                                    <option value="">Select Patient</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="requestType" class="form-label">Request Type *</label>
                                <select class="form-select" id="requestType" required>
                                    <option value="">Select Type</option>
                                    <option value="medicine">Medicine</option>
                                    <option value="labtest">Lab Test</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="requestItem" class="form-label">Item *</label>
                                <select class="form-select" id="requestItem" required disabled>
                                    <option value="">Select Type First</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="requestQuantity" class="form-label">Quantity *</label>
                                <input type="number" class="form-control" id="requestQuantity" min="1" required>
                            </div>
                            <div class="col-12">
                                <label for="requestNotes" class="form-label">Notes</label>
                                <textarea class="form-control" id="requestNotes" rows="3"
                                    placeholder="Additional instructions or notes..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitRequestBtn">Submit Request</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Details Modal -->
    <div class="modal fade" id="requestDetailsModal" tabindex="-1" aria-labelledby="requestDetailsModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="requestDetailsModalLabel">Request Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="requestDetailsContent">
                        <!-- Content will be loaded dynamically -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-warning d-none" id="cancelRequestBtn">Cancel Request</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
